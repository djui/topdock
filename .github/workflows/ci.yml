name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: TopDock
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: swift --version
      - name: Build app bundle
        run: scripts/bundle.sh
      - uses: actions/upload-artifact@v7
        with:
          name: TopDock.app
          path: TopDock/dist/TopDock.app
          retention-days: 7
